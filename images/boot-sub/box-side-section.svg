<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="640" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="520" height="330" fill="#ffffff"/>
<!-- 1 px = 1 mm. Down-firing: box 300 mm front-to-back, 115 mm tall, 18 mm MDF, on 44 mm feet -->
<line x1="10" y1="270" x2="400" y2="270" stroke="#888780" stroke-width="1.5"/>
<!-- feet sit at the ends of the box, behind this section: dashed -->
<g fill="none" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="3 2">
<rect x="56" y="226" width="44" height="44"/>
<rect x="312" y="226" width="44" height="44"/>
</g>
<!-- seat side: steel angle bolted to the floor; peg on the box face drops into its upright -->
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5">
<rect x="14" y="262" width="40" height="8"/>
<rect x="46" y="150" width="8" height="120"/>
<rect x="38" y="164" width="18" height="7" fill="#5F5E5A"/>
</g>
<!-- box -->
<g fill="#FAC775" stroke="#854F0B" stroke-width="0.5">
<rect x="56" y="111" width="300" height="18"/>
<rect x="56" y="208" width="300" height="18"/>
<rect x="56" y="129" width="18" height="79"/>
<rect x="338" y="129" width="18" height="79"/>
</g>
<!-- carpet on top -->
<rect x="56" y="107" width="300" height="4" fill="#5F5E5A"/>
<!-- sub in the bottom panel, firing down: tab ears on the outside face, magnet up inside -->
<rect x="64" y="226" width="284" height="5" fill="#5F5E5A"/>
<polygon points="84,226 328,226 268,170 144,170" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="141" y="143" width="130" height="27" rx="2" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<!-- bass escaping under the edges -->
<g stroke="#5F5E5A" stroke-width="1" fill="none">
<path d="M150 252 L36 252"/><path d="M42 248 L36 252 L42 256"/>
<path d="M262 252 L376 252"/><path d="M370 248 L376 252 L370 256"/>
</g>
<!-- toggle latch on the tailgate face -->
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5">
<rect x="356" y="180" width="10" height="24"/>
<rect x="366" y="196" width="16" height="74"/>
</g>
<g stroke="#888780" stroke-width="0.5" fill="none">
<line x1="400" y1="111" x2="400" y2="226"/>
<line x1="394" y1="111" x2="406" y2="111"/>
<line x1="394" y1="226" x2="406" y2="226"/>
<line x1="400" y1="231" x2="400" y2="270"/>
<line x1="394" y1="270" x2="406" y2="270"/>
<line x1="300" y1="129" x2="300" y2="143"/>
<line x1="295" y1="129" x2="305" y2="129"/>
<line x1="295" y1="143" x2="305" y2="143"/>
</g>
<g fill="#3d3d3a">
<text x="410" y="102">Solid carpeted top</text>
<text x="410" y="172">115 mm box</text>
<text x="410" y="254">44 mm feet</text>
<text x="308" y="140" font-size="10">14 mm</text>
<text x="388" y="196">Latch</text>
<text x="6" y="132">Peg into</text>
<text x="6" y="146">floor angle</text>
<text x="180" y="160" font-size="10">Magnet</text>
<text x="206" y="290" text-anchor="middle">Cone faces the floor — bass escapes under the edges</text>
<text x="410" y="290">Boot floor</text>
</g>
<text x="10" y="318" fill="#73726c">Side view through the sub, ~160 mm total. Seat side left, tailgate right. Feet (dashed) are at the box ends. To scale.</text>
</svg>
