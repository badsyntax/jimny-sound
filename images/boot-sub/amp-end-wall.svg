<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="600" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="480" height="280" fill="#ffffff"/>
<!-- amp end wall seen from outside, 1 px = 1 mm. Wall 300 wide x 141 tall, top panel edge (18) above it, floor at y=200 -->
<line x1="10" y1="200" x2="330" y2="200" stroke="#888780" stroke-width="1.5"/>
<rect x="20" y="41" width="300" height="18" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<rect x="20" y="59" width="300" height="141" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
<!-- behind the wall: inside of the box (between top and bottom panels, between the long walls) and the bottom panel -->
<g fill="none" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="4 3">
<rect x="38" y="59" width="264" height="79"/>
<rect x="38" y="138" width="264" height="18"/>
</g>
<!-- two binding posts, 40 mm down from the top edge, 50 and 90 mm in from the left edge, 40 mm apart -->
<circle cx="70" cy="99" r="8" fill="#A32D2D" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="110" cy="99" r="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<g fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle"><text x="70" y="103">+</text><text x="110" y="103">−</text></g>
<!-- amp standing on its 130 mm edge, beside the posts -->
<rect x="145" y="60" width="153" height="130" rx="3" fill="#444441"/>
<text x="221.5" y="130" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">UP 1FX</text>
<!-- bracket + knob below the posts, in the 44 mm gap -->
<rect x="60" y="170" width="30" height="30" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="75" cy="178" r="9" fill="#444441"/>
<!-- dimensions -->
<g stroke="#888780" stroke-width="0.5" fill="none">
<line x1="328" y1="59" x2="328" y2="138"/><line x1="323" y1="59" x2="333" y2="59"/><line x1="323" y1="138" x2="333" y2="138"/>
<line x1="328" y1="156" x2="328" y2="200"/><line x1="323" y1="156" x2="333" y2="156"/><line x1="323" y1="200" x2="333" y2="200"/>
</g>
<g fill="#3d3d3a">
<text x="90" y="80" text-anchor="middle">Binding posts</text>
<text x="338" y="54">Top panel</text>
<text x="338" y="96">Inside the box</text>
<text x="338" y="110" font-size="10" fill="#73726c">(behind, dashed)</text>
<text x="338" y="151">Bottom panel</text>
<text x="338" y="182">44 mm gap</text>
<text x="338" y="204">Boot floor</text>
<text x="75" y="218" text-anchor="middle">Bracket + knob</text>
</g>
<g fill="#73726c" font-size="10">
<text x="20" y="246">Amp end wall from outside, to scale. Drill the holes in step 2, fit the posts in step 4.6.</text>
<text x="20" y="260">The bracket sits under the posts, where the amp can't hit the knob.</text>
<text x="20" y="274">If the old bolt is on the other side, mirror it: posts and bracket that side, amp this side.</text>
</g>
</svg>
