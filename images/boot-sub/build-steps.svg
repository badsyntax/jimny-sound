<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 700" width="480" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="380" height="700" fill="#ffffff"/><title>Building the box in six steps, using a flip instead of blocks</title><desc>One: lay the bottom panel flat. Two: stand the two long walls on it and screw up through the bottom. Three: flip it over so the long walls rest on the bench. Four: stand the two taller end walls on the bench at each end and screw them on; they stick up 44 mm past the bottom panel. Five: flip it back, so the end walls hold the box 44 mm off the floor. Six: fit the top with the brace underneath.</desc><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="22">1</text><text font-size="12" fill="#3d3d3a" x="40" y="22">Lay the bottom flat</text><line x1="20" y1="110" x2="360" y2="110" stroke="#888780" stroke-width="1"/><polygon points="70,104.6 263.2,104.6 308.2,74.6 115,74.6" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,110 263.2,104.6 308.2,74.6 308.2,80" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="104.6" width="193.2" height="5.4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="134">2</text><text font-size="12" fill="#3d3d3a" x="40" y="134">Long walls on, screwed up through the bottom</text><line x1="20" y1="222" x2="360" y2="222" stroke="#888780" stroke-width="1"/><polygon points="112.3,164.7 305.5,164.7 308.2,162.9 115.0,162.9" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="112.3" y="164.7" width="193.2" height="23.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="70,216.6 263.2,216.6 308.2,186.6 115,186.6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,222 263.2,216.6 308.2,186.6 308.2,192" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="216.6" width="193.2" height="5.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,192.9 263.2,192.9 265.9,191.1 72.7,191.1" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="70.0" y="192.9" width="193.2" height="23.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="246">3</text><text font-size="12" fill="#3d3d3a" x="40" y="246">Flip it: long walls down, bottom on top</text><line x1="20" y1="334" x2="360" y2="334" stroke="#888780" stroke-width="1"/><polygon points="112.3,282.1 305.5,282.1 308.2,280.3 115.0,280.3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="112.3" y="282.1" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,310.3 263.2,310.3 265.9,308.5 72.7,308.5" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70.0" y="310.3" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70,304.9 263.2,304.9 308.2,274.9 115,274.9" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,310.3 263.2,304.9 308.2,274.9 308.2,280.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="304.9" width="193.2" height="5.4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="358">4</text><text font-size="12" fill="#3d3d3a" x="40" y="358">End walls on the bench, sticking up 44 mm</text><line x1="20" y1="446" x2="360" y2="446" stroke="#888780" stroke-width="1"/><polygon points="112.3,394.1 305.5,394.1 308.2,392.3 115.0,392.3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="112.3" y="394.1" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,422.3 263.2,422.3 265.9,420.5 72.7,420.5" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70.0" y="422.3" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70,416.9 263.2,416.9 308.2,386.9 115,386.9" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,422.3 263.2,416.9 308.2,386.9 308.2,392.3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="416.9" width="193.2" height="5.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="64.6,403.7 70.0,403.7 115.0,373.7 109.6,373.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,446 70.0,403.7 115.0,373.7 115.0,416" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="64.6" y="403.7" width="5.4" height="42.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,403.7 268.5,403.7 313.5,373.7 308.2,373.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="268.5,446 268.5,403.7 313.5,373.7 313.5,416" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="263.2" y="403.7" width="5.4" height="42.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><line x1="321.5" y1="373.7" x2="321.5" y2="386.9" stroke="#A32D2D" stroke-width="1"/><text font-size="12" x="327.5" y="384.9" fill="#A32D2D">44</text><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="470">5</text><text font-size="12" fill="#3d3d3a" x="40" y="470">Flip back: end walls hold it 44 mm up</text><line x1="20" y1="558" x2="360" y2="558" stroke="#888780" stroke-width="1"/><polygon points="112.3,487.5 305.5,487.5 308.2,485.7 115.0,485.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="112.3" y="487.5" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70,539.4 263.2,539.4 308.2,509.4 115,509.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,544.8 263.2,539.4 308.2,509.4 308.2,514.8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="539.4" width="193.2" height="5.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,515.6 263.2,515.6 265.9,513.9 72.7,513.9" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70.0" y="515.7" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="64.6,515.7 70.0,515.7 115.0,485.7 109.6,485.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,558 70.0,515.7 115.0,485.7 115.0,528" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="64.6" y="515.7" width="5.4" height="42.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,515.7 268.5,515.7 313.5,485.7 308.2,485.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="268.5,558 268.5,515.7 313.5,485.7 313.5,528" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="263.2" y="515.7" width="5.4" height="42.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text font-size="14" font-weight="bold" fill="#3d3d3a" x="20" y="582">6</text><text font-size="12" fill="#3d3d3a" x="40" y="582">Top on last, brace underneath</text><line x1="20" y1="670" x2="360" y2="670" stroke="#888780" stroke-width="1"/><polygon points="112.3,599.5 305.5,599.5 308.2,597.7 115.0,597.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="112.3" y="599.5" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70,651.4 263.2,651.4 308.2,621.4 115,621.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,656.8 263.2,651.4 308.2,621.4 308.2,626.8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70" y="651.4" width="193.2" height="5.4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,627.6 263.2,627.6 265.9,625.9 72.7,625.9" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="70.0" y="627.7" width="193.2" height="23.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="64.6,627.7 70.0,627.7 115.0,597.7 109.6,597.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="70.0,670 70.0,627.7 115.0,597.7 115.0,640" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="64.6" y="627.7" width="5.4" height="42.3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="263.2,627.7 268.5,627.7 313.5,597.7 308.2,597.7" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="268.5,670 268.5,627.7 313.5,597.7 313.5,640" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><rect x="263.2" y="627.7" width="5.4" height="42.3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><polygon points="64.6,622.3 268.6,622.3 313.6,592.3 109.6,592.3" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><polygon points="268.6,627.7 268.6,622.3 313.6,592.3 313.6,597.7" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><rect x="64.6" y="622.3" width="204.0" height="5.4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text font-size="12" fill="#3d3d3a" x="20" y="692">Darker orange = the piece added or moved in that step.</text></svg>