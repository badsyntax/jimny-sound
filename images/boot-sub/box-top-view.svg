<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 266" width="640" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="520" height="266" fill="#ffffff"/>
<!-- box outline: 680 x 300 mm at 0.6 px/mm -> 408 x 180. Solid top; sub underneath, firing down -->
<rect x="40" y="30" width="408" height="180" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<!-- sub underneath (hidden): overall 284 mm -> r 85, cutout 244 -> r 73; centre 200 mm from the left end -->
<circle cx="160" cy="120" r="85" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="160" cy="120" r="73" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 3"/>
<!-- brace under the middle of the top -->
<rect x="238" y="41" width="11" height="158" fill="none" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="4 3"/>
<!-- the two short end walls (18 mm -> 11 px) extend down to the floor -->
<g fill="#E8A951" stroke="#854F0B" stroke-width="0.5">
<rect x="40" y="30" width="11" height="180"/>
<rect x="437" y="30" width="11" height="180"/>
</g>
<!-- UP 1FX on the right end wall: 46 mm deep x 153 mm, standing on its 130 mm edge; box terminal beside it -->
<rect x="448" y="43" width="28" height="92" rx="2" fill="#444441"/>
<rect x="448" y="145" width="6" height="47" fill="#5F5E5A"/>
<!-- brackets + star knobs at each end, on the old compartment's bolts -->
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5">
<rect x="22" y="45" width="18" height="20"/>
<rect x="22" y="175" width="18" height="20"/>
<rect x="448" y="175" width="18" height="20"/>
</g>
<g fill="#3d3d3a">
<text x="245" y="18" text-anchor="middle">Seat side — open underneath</text>
<text x="245" y="230" text-anchor="middle">Tailgate side — open underneath</text>
<text x="160" y="116" text-anchor="middle" font-size="11">10TW3 underneath,</text>
<text x="160" y="130" text-anchor="middle" font-size="11">firing down</text>
<text x="255" y="98" font-size="11">Brace (middle)</text>
<text x="480" y="93" font-size="11">Amp</text>
<text x="458" y="160" font-size="10">Terminal</text>
<text x="470" y="192" font-size="10">Bracket</text>
</g>
<g fill="#73726c" font-size="10">
<text x="245" y="256" text-anchor="middle">680 × 300 mm, looking down, to scale. Dashed = hidden below. Orange ends reach the floor. Grey = brackets + knobs.</text>
</g>
</svg>
