<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 266" width="640" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="520" height="266" fill="#ffffff"/>
<!-- box outline: 730 x 300 mm at 0.6 px/mm -> 438 x 180. Solid top; sub underneath, firing down -->
<rect x="40" y="30" width="438" height="180" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<!-- sub underneath (hidden): overall 284 mm -> r 85, cutout 244 -> r 73; centre 200 mm from left -->
<circle cx="160" cy="120" r="85" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="160" cy="120" r="73" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 3"/>
<!-- brace under the top -->
<rect x="300" y="41" width="11" height="158" fill="none" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="4 3"/>
<!-- feet underneath: corners + midway on long edges, 60 x 44 mm -> 36 x 26 -->
<g fill="#E8A951" stroke="#854F0B" stroke-width="0.5" fill-opacity="0.6">
<rect x="40" y="30" width="26" height="36"/>
<rect x="40" y="174" width="26" height="36"/>
<rect x="452" y="30" width="26" height="36"/>
<rect x="452" y="174" width="26" height="36"/>
<rect x="320" y="30" width="36" height="26"/>
<rect x="320" y="184" width="36" height="26"/>
</g>
<!-- speakon on right end panel -->
<rect x="478" y="108" width="8" height="24" rx="2" fill="#5F5E5A"/>
<!-- latches on tailgate edge (bottom) -->
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5">
<rect x="110" y="210" width="26" height="12"/>
<rect x="382" y="210" width="26" height="12"/>
</g>
<!-- floor angle on seat edge (top), pegs at each end -->
<rect x="40" y="20" width="438" height="6" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="80" y="24" width="6" height="10" fill="#5F5E5A"/>
<rect x="430" y="24" width="6" height="10" fill="#5F5E5A"/>
<g fill="#3d3d3a">
<text x="259" y="13" text-anchor="middle">Seat side — two pegs into a floor-bolted steel angle</text>
<text x="259" y="240" text-anchor="middle">Tailgate side — two toggle latches</text>
<text x="160" y="116" text-anchor="middle" font-size="11">10TW3 underneath,</text>
<text x="160" y="130" text-anchor="middle" font-size="11">firing down</text>
<text x="372" y="98" font-size="11">Brace</text>
<text x="380" y="124" font-size="11">Speakon →</text>
</g>
<g fill="#73726c" font-size="10">
<text x="259" y="258" text-anchor="middle">730 × 300 mm, looking down on the solid top, to scale. Dashed = hidden below. Orange = feet.</text>
</g>
</svg>
